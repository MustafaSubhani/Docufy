[project]
name = "docufy"
version = "0.4.0"
description = "Docufy: a local document studio that sets notes in the Spark Technologies template."
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.2",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psutil>=6",
    "keyring>=25",
]

[project.scripts]
docufy = "spark_agent.__main__:main"
spark-doc = "spark_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.26", "scikit-image>=0.22"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["input", "output", "assets", "_analysis", "sample pdfs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"create_doc.py" = ["E402", "F841"]
"spark_docs/__main__.py" = ["E402"]
