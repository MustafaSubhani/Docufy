  width: 595.28
  height: 841.89
  margin_left: 60
  top: 60              # first line box top on every inner page
  frame_top: 58        # ReportLab frame top; blocks add a small per-kind top adjust
  bottom: 48
  text_width: 478      # justified body text runs 60 -> 538
  break_width: 476.2   # effective line-break width measured from the reference (Google Docs rounding)
  rule_right: 535
  box_width: 451.5     # tables, callouts, banner, cover box: 60 -> 511.5
  gdocs_ascent: 0.9355 # Google Docs first-baseline factor (top + 0.9355 * size)

