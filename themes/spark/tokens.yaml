# Spark theme tokens, measured from sample pdfs/ADICC_Proposal_updated (1).pdf with spark_docs.measure.
# Distances are in PDF points. "base" = text baseline. Spacing entries are measured from the previous
# block's last reference line (last baseline, or bottom edge for boxes) to the next block's first
# reference line (first baseline, or top edge for boxes).

name: spark
version: 1

