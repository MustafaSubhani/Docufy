# Model profiles. Switch with SPARK_PROFILE=claude (or openai) once API keys exist.
active_profile: dev

profiles:
  dev:                                   # local development on Ollama (no API keys)
    planner: ollama/qwen2.5-coder:7b     # keep 7B for planning; writer uses Gemma 4 cloud
    writer: ollama/gemma4:31b-cloud      # Ollama Cloud — better instruction following for research UI
    extractor: ollama/qwen2.5-coder:7b
    critic_vision: ollama/qwen2.5vl:7b
    researcher: ollama/gemma4:31b-cloud
    diagrammer: ollama/qwen2.5-coder:7b
  claude:
    planner: anthropic/claude-sonnet-4-5
    writer: anthropic/claude-sonnet-4-5
    extractor: anthropic/claude-haiku-4-5
    critic_vision: anthropic/claude-sonnet-4-5
    researcher: anthropic/claude-sonnet-4-5
    diagrammer: anthropic/claude-sonnet-4-5
  openai:
    planner: openai/gpt-5
    writer: openai/gpt-5
    extractor: openai/gpt-5-mini
    critic_vision: openai/gpt-5
    researcher: openai/gpt-5
    diagrammer: openai/gpt-5

budgets:
  per_run_usd: 3.0
  max_verify_iterations: 4
  score_delta: 1.0          # stop when a fix improves the score by less than this

fallbacks:
  claude: openai
  openai: claude

privacy:
  local_only: false

governor:
  dev_workers: 1          # local models share one GPU; the dev profile stays sequential
  cloud_workers: 4
  low_resource: false
  llm_per_provider: 4
  fetches: 8
  fetches_per_domain: 2
  browser: 2
  cpu: 2
  gpu: 1
  pause_at: 75
  trim_at: 85
  checkpoint_at: 92
  success_streak: 3

ollama:
  url: http://127.0.0.1:11434
  num_ctx: 16384          # 7B Q4 + 16k KV fits the 8 GB A2000; see plan 6.6 before raising
  keep_alive: 10m

limits:
  max_output_tokens: 4096
  request_timeout_s: 300
  retries: 2

models:
  ollama/qwen2.5-coder:7b:
    context: 32768
    max_output: 4096
    json_schema: true
    vision: false
    layers: 28
    kv_heads: 4
    head_dim: 128
    weight_gb: 4.7
  ollama/qwen2.5vl:7b:
    context: 32768
    max_output: 4096
    json_schema: true
    vision: true
    layers: 28
    kv_heads: 4
    head_dim: 128
    weight_gb: 4.7
  ollama/gemma4:31b-cloud:
    context: 262144
    max_output: 8192
    json_schema: true
    vision: true
    layers: 60
    kv_heads: 8
    head_dim: 128
    weight_gb: 0
  # Prices are USD per million tokens from the provider pages. Check them before relying on the budget.
  anthropic/claude-sonnet-4-5:
    context: 200000
    max_output: 8192
    json_schema: true
    vision: true
    prompt_cache: true
    input_usd_per_mtok: 3.0
    output_usd_per_mtok: 15.0
  anthropic/claude-haiku-4-5:
    context: 200000
    max_output: 8192
    json_schema: true
    vision: true
    input_usd_per_mtok: 1.0
    output_usd_per_mtok: 5.0
  openai/gpt-5:
    context: 128000
    max_output: 16384
    json_schema: true
    vision: true
    prompt_cache: true
    input_usd_per_mtok: 1.25
    output_usd_per_mtok: 10.0
  openai/gpt-5-mini:
    context: 128000
    max_output: 16384
    json_schema: true
    vision: true
    input_usd_per_mtok: 0.25
    output_usd_per_mtok: 2.0
